<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UpMee</title>
  
  <!-- SEO & Meta -->
  <meta name="description" content="UpMee — Instant Share" />
  <meta name="theme-color" content="#fce7f3" />
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="UpMee" />
  
  <!-- Google Fonts: Fredoka & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Decorative Floating Background Bubbles -->
  <div class="bg-bubble bubble-1"></div>
  <div class="bg-bubble bubble-2"></div>
  <div class="bg-bubble bubble-3"></div>

  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <img src="/bunny_mascot.png" alt="UpMee Bunny Mascot" class="bunny-logo-img" />
        <span class="logo-text">UpMee</span>
      </div>

      <div class="header-actions">
        <!-- History / Chat Bubble Anchor Button -->
        <button id="history-btn" class="icon-btn icon-only" title="History & Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 16 14"/>
          </svg>
        </button>

        <!-- Icon-only Install Button -->
        <button id="pwa-install-btn" class="icon-btn icon-only hidden" title="Install App">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>

        <!-- Settings Button -->
        <button id="settings-btn" class="icon-btn icon-only" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Bubble Popover pointing to History Button -->
    <div id="history-popover" class="chat-bubble-popover hidden">
      <div class="popover-arrow"></div>
      <div class="popover-header">
        <span class="popover-title">🕒 History</span>
        <label class="popover-toggle-label" title="Enable Notifications">
          <span class="toggle-text-sm">🔔 Notifications</span>
          <div class="toggle-switch sm">
            <input type="checkbox" id="popover-notify-toggle" />
            <span class="slider sm"></span>
          </div>
        </label>
      </div>
      <button type="button" id="force-register-push-btn" class="secondary-btn full-width-sm" style="width: 100%; margin: 6px 0; padding: 6px 10px; font-size: 0.8rem; border-radius: 8px;">
        🔔 Register Notifications
      </button>
      <div id="history-list-container" class="history-list-container">
        <div class="loading-spinner-box"><p>Loading history...</p></div>
      </div>
    </div>

    <!-- Storage Bar (% Only) -->
    <div class="storage-bar-card">
      <div class="storage-bar-info">
        <span class="storage-bar-title">Storage</span>
        <span id="storage-usage-text" class="storage-usage-text">0%</span>
      </div>
      <div class="progress-bar-track">
        <div id="storage-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Main Container -->
    <main class="main-container">

      <!-- SECTION 1: ☁️ CLOUD FEED (TOP POSITION) -->
      <section class="cloud-feed-card cloud-container-scallop">
        <!-- Floating Animated Background Decorative Clouds -->
        <div class="cloud-bg-puff cloud-puff-1"></div>
        <div class="cloud-bg-puff cloud-puff-2"></div>
        <div class="cloud-bg-puff cloud-puff-3"></div>

        <!-- Cloud Header Wrapper Bar -->
        <div class="cloud-header-wrapper">
          <div class="cloud-header-main">
            <div class="cloud-illustration-badge">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" class="cloud-svg-icon">
                <defs>
                  <linearGradient id="cloudHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f472b6" />
                    <stop offset="100%" stop-color="#c084fc" />
                  </linearGradient>
                </defs>
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="url(#cloudHeaderGrad)" opacity="0.2" />
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" stroke="url(#cloudHeaderGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 12v4m-2-2l2 2 2-2" stroke="url(#cloudHeaderGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <div class="cloud-pulse-dot" title="Live Synced"></div>
            </div>

            <div class="cloud-title-block">
              <div class="cloud-title-row">
                <h2 class="cloud-section-title">Cloud Storage</h2>
                <span id="cloud-file-count" class="cloud-count-pill">0 items</span>
              </div>
              <p class="cloud-section-subtitle">Uploaded files & quick shares</p>
            </div>
          </div>

          <div class="cloud-header-actions">
            <!-- Multi-Select Mode Toggle Button -->
            <button id="toggle-select-mode-btn" class="cloud-action-btn" title="Select Multiple Items">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 11 12 14 22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
              <span class="action-btn-text">Select</span>
            </button>

            <!-- Download All as ZIP Button -->
            <button id="download-all-btn" class="cloud-action-btn" title="Download All Files as ZIP">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span class="action-btn-text">Zip All</span>
            </button>

            <!-- Refresh Button -->
            <button id="refresh-feed-btn" class="cloud-refresh-btn" title="Refresh Cloud Feed">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Floating Batch Action Toolbar (Visible when selecting items) -->
        <div id="batch-actions-bar" class="batch-actions-bar hidden">
          <div class="batch-info-area">
            <label class="batch-select-all-label">
              <input type="checkbox" id="batch-select-all-cb" class="custom-checkbox" />
              <span id="batch-selected-count" class="batch-count-text">0 selected</span>
            </label>
          </div>
          <div class="batch-buttons-group">
            <button type="button" id="batch-download-zip-btn" class="batch-btn batch-btn-zip" title="Download Selected as ZIP">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span>Download ZIP</span>
            </button>
            <button type="button" id="batch-download-separate-btn" class="batch-btn batch-btn-separate" title="Download Each File Concurrently">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
              <span>Parallel</span>
            </button>
            <button type="button" id="batch-delete-btn" class="batch-btn batch-btn-danger" title="Delete Selected Items">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
            <button type="button" id="batch-cancel-btn" class="batch-btn-close" title="Cancel Selection">&times;</button>
          </div>
        </div>

        <!-- Cloud Content Grid -->
        <div id="live-feed-container" class="cloud-items-grid">
          <div class="loading-spinner-box">
            <div class="cloud-loader">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" class="spin-cloud">
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 2"/>
              </svg>
              <p>Loading Cloud Vault...</p>
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 2: UPLOAD MEE -->
      <section class="page-card">
        <h2 class="card-title">Upload Mee</h2>

        <form id="share-form" class="inner-form">
          <div class="form-group">
            <label for="text-content">Message / Link</label>
            <textarea id="text-content" rows="3" placeholder="text here"></textarea>
          </div>

          <div class="form-group">
            <div class="label-with-count">
              <label>แนบไฟล์ (เลือกได้หลายไฟล์ ไม่เกิน 50MB ต่อไฟล์)</label>
              <span id="queue-file-count-badge" class="queue-badge hidden">0 files</span>
            </div>
            <div id="dropzone" class="file-dropzone cloud-look-dropzone">
              <input type="file" id="file-input" class="hidden-file-input" multiple />
              
              <div id="dropzone-empty-content" class="dropzone-content">
                <div class="cloud-dropzone-icon">
                  <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="url(#cloudGrad)" stroke="var(--accent-pink)"/>
                    <path d="M12 11v6" stroke="var(--accent-pink)" stroke-width="2" stroke-linecap="round"/>
                    <path d="M9.5 13.5L12 11l2.5 2.5" stroke="var(--accent-pink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                      <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="60%" stop-color="#fce7f3"/>
                        <stop offset="100%" stop-color="#f3e8ff"/>
                      </linearGradient>
                    </defs>
                  </svg>
                </div>
                <p class="dropzone-title">อัพโหลดไฟล์ (เลือกได้หลายไฟล์)</p>
                <p class="dropzone-subtitle">คลิกหรือลากไฟล์มาวางพร้อมกันได้ ไม่เกิน 50MB/ไฟล์</p>
              </div>

              <!-- Multi-file preview container -->
              <div id="file-preview" class="file-preview-queue hidden">
                <div class="queue-header">
                  <div class="queue-summary">
                    <span class="queue-title-text">📂 Selected Files</span>
                    <span id="queue-total-size" class="queue-size-text">0 MB</span>
                  </div>
                  <div class="queue-actions">
                    <button type="button" id="add-more-files-btn" class="queue-action-link" title="Add More Files">+ Add more</button>
                    <button type="button" id="clear-all-files-btn" class="queue-action-link danger" title="Clear All Files">Clear all</button>
                  </div>
                </div>
                
                <div id="selected-files-list" class="selected-files-list"></div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>ระยะเวลาหมดอายุไฟล์</label>
            <div class="expiry-pills">
              <button type="button" class="pill-btn" data-value="1h">1 ชม.</button>
              <button type="button" class="pill-btn" data-value="8h">8 ชม.</button>
              <button type="button" class="pill-btn active" data-value="24h">24 ชม.</button>
              <button type="button" class="pill-btn" data-value="7d">1 อาทิตย์</button>
            </div>
          </div>

          <button type="submit" id="submit-share-btn" class="primary-btn">
            <span>Upload 🐰</span>
          </button>
        </form>
      </section>

    </main>

    <!-- Supabase Config Modal -->
    <div id="config-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Settings</h3>
          <button id="close-modal-btn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="cfg-url">Supabase Project URL</label>
            <input type="text" id="cfg-url" placeholder="https://your-project.supabase.co" />
          </div>
          <div class="form-group">
            <label for="cfg-key">Supabase Anon Key</label>
            <input type="password" id="cfg-key" placeholder="eyJhbGciOiJIUzI1NiIsIn..." />
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-config-btn" class="primary-btn">Save</button>
        </div>
      </div>
    </div>

    <!-- Item Preview Modal -->
    <div id="item-modal" class="modal-backdrop hidden">
      <div class="modal-card item-modal-card">
        <div class="modal-header">
          <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
            <span id="modal-item-badge" class="item-type-badge">Preview</span>
            <span id="modal-file-name" class="modal-file-name-title">filename.png</span>
          </div>
          <button id="close-item-modal-btn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div id="modal-preview-area" class="modal-preview-box"></div>
          <div id="modal-text-content" class="modal-text-box hidden"></div>
        </div>
        <div class="modal-footer item-actions-footer">
          <button type="button" id="modal-copy-btn" class="icon-btn-purple hidden" title="Copy Text">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          
          <a id="modal-open-link-btn" href="#" target="_blank" rel="noopener noreferrer" class="icon-btn-purple hidden" title="Open Link" style="text-decoration: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </a>

          <button type="button" id="modal-download-btn" class="icon-btn-pink hidden" title="Download File">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>

          <button type="button" id="modal-share-btn" class="icon-btn-purple" title="Share / QR Code">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </button>

          <button type="button" id="modal-delete-btn" class="icon-action-btn-danger" style="margin-left: auto;" title="Delete">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="modal-backdrop hidden">
      <div class="modal-card qr-modal-card text-center" style="align-items: center;">
        <div class="modal-header" style="width: 100%;">
          <h3>QR Code</h3>
          <button id="close-qr-modal-btn" class="close-btn">&times;</button>
        </div>
        <div class="qr-modal-body" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 16px; padding: 16px 0;">
          <canvas id="qr-modal-canvas" style="display: block; margin: 0 auto; border-radius: 16px; box-shadow: 0 4px 16px rgba(236,72,153,0.12);"></canvas>
          
          <button type="button" id="qr-native-share-btn" class="icon-btn-pink" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;" title="Share to Apps">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
