<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UpMee 🐰 Cloud Share</title>
  
  <!-- SEO & PWA Meta Tags -->
  <meta name="description" content="UpMee - ระบบรับส่งไฟล์และแปะข้อความชั่วคราว สะดวก รวดเร็ว ทำงานข้ามอุปกรณ์">
  <meta name="theme-color" content="#ec4899">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/bunny_mascot.png">
  <link rel="apple-touch-icon" href="/bunny_mascot.png">

  <!-- Google Fonts: Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- Top Bar Navigation Header -->
    <header class="app-header">
      <div class="brand-title">
        <img src="/bunny_mascot.png" alt="UpMee Bunny" class="header-logo-img">
        <span class="brand-name">UpMee</span>
      </div>

      <div class="header-actions">
        <!-- History Button (Triggers Chat Bubble Popover) -->
        <button id="history-btn" class="header-icon-btn history-trigger-btn" title="ประวัติการ upload" aria-label="ประวัติการ upload">
          <svg class="header-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 15"/>
          </svg>
        </button>

        <!-- Settings Button -->
        <button id="settings-btn" class="header-icon-btn" title="ตั้งค่า">
          <svg class="header-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Bubble Popover (Upload History + Notification Toggle) -->
    <div id="history-popover" class="chat-bubble-popover hidden" role="dialog" aria-label="ประวัติการอัปโหลด">
      <div class="popover-arrow"></div>
      <div class="popover-header">
        <span class="popover-title">ประวัติการ upload</span>
        <div class="notify-toggle-wrapper">
          <span class="notify-toggle-label">🔔 Notify</span>
          <label class="switch">
            <input type="checkbox" id="popover-notify-toggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <button type="button" id="force-register-push-btn">
        🔔 ลงทะเบียน Push แจ้งเตือนบนเครื่องนี้
      </button>
      <div id="history-list-container" class="history-list-scroll">
        <!-- History items dynamically inserted here -->
      </div>
    </div>

    <!-- Storage Capacity Bar Card -->
    <section class="storage-card">
      <div class="storage-info-header">
        <span class="storage-label">Storage</span>
        <span id="storage-usage-text" class="storage-value">0%</span>
      </div>
      <div class="storage-progress-track">
        <div id="storage-progress-fill" class="storage-progress-fill" style="width: 0%;"></div>
      </div>
    </section>

    <!-- Cloud Feed Section (PLACED ON TOP OF UPLOAD FORM) -->
    <section class="feed-section-card">
      <div class="feed-header">
        <span class="feed-cloud-icon">☁️</span>
        <button type="button" id="refresh-feed-btn" class="icon-refresh-btn" title="รีเฟรช">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
      </div>

      <div id="live-feed-container" class="live-feed-container">
        <!-- Live feed cards dynamically inserted here -->
      </div>
    </section>

    <!-- Upload Form Card (PLACED AT THE BOTTOM) -->
    <main class="upload-form-card">
      <h2 class="form-card-title">Upload Mee</h2>
      
      <form id="share-form" class="share-form">
        <!-- Message / Link -->
        <div class="form-group">
          <label for="text-content" class="input-label-pink">Message / Link</label>
          <textarea id="text-content" class="custom-textarea" rows="3" placeholder="text here"></textarea>
        </div>

        <!-- แนบไฟล์ ไม่เกิน 50MB -->
        <div class="form-group">
          <label class="input-label-pink">แนบไฟล์ ไม่เกิน 50MB</label>
          <div id="dropzone" class="dropzone-dashed-box">
            <input type="file" id="file-input" class="hidden-file-input">
            
            <div class="dropzone-content">
              <p class="dropzone-text">แนบไฟล์ / ลากมาวาง</p>
            </div>

            <!-- File Selected Preview -->
            <div id="file-preview" class="file-preview-box hidden">
              <div class="file-preview-info">
                <span class="file-icon-badge">📁</span>
                <div class="file-meta">
                  <span id="file-name" class="file-name-text">filename.pdf</span>
                  <span id="file-size" class="file-size-text">0 MB</span>
                </div>
              </div>
              <button type="button" id="remove-file-btn" class="icon-btn-danger" title="ยกเลิกไฟล์">✕</button>
            </div>
          </div>
        </div>

        <!-- ระยะเวลาหมดอายุไฟล์ -->
        <div class="form-group">
          <label class="input-label-pink">ระยะเวลาหมดอายุไฟล์</label>
          <div class="expiration-pill-selector">
            <button type="button" class="pill-btn" data-value="1h">1 ชม.</button>
            <button type="button" class="pill-btn" data-value="8h">8 ชม.</button>
            <button type="button" class="pill-btn active" data-value="24h">24 ชม.</button>
            <button type="button" class="pill-btn" data-value="7d">1 อาทิตย์</button>
          </div>
        </div>

        <!-- Full Width Pill Submit Button -->
        <button type="submit" id="submit-share-btn" class="primary-pill-btn">
          <span>Upload 🐰</span>
        </button>
      </form>
    </main>

  </div>

  <!-- Settings Config Modal -->
  <div id="config-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">⚙️ ตั้งค่า Supabase Connection</h3>
        <button type="button" id="close-modal-btn" class="close-btn">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="cfg-url" class="input-label-pink">Supabase URL</label>
          <input type="text" id="cfg-url" class="custom-input" placeholder="https://xxx.supabase.co">
        </div>
        <div class="form-group">
          <label for="cfg-key" class="input-label-pink">Supabase Anon Key</label>
          <input type="password" id="cfg-key" class="custom-input" placeholder="eyJhbGciOi...">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="save-config-btn" class="primary-pill-btn">บันทึกตั้งค่า 💖</button>
      </div>
    </div>
  </div>

  <!-- Large Item Details / Image Preview Modal -->
  <div id="item-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card item-details-card">
      <div class="modal-header">
        <span id="modal-item-badge" class="item-type-badge">Preview</span>
        <button type="button" id="close-item-modal-btn" class="close-btn">✕</button>
      </div>
      <div class="modal-body text-center">
        <div id="modal-preview-area" class="modal-preview-area"></div>
        <div id="modal-text-content" class="modal-text-box hidden"></div>
      </div>
      <div class="modal-footer flex-wrap gap-2 justify-center">
        <button type="button" id="modal-copy-btn" class="secondary-btn hidden">📋 คัดลอกข้อความ</button>
        <a id="modal-open-link-btn" href="#" target="_blank" rel="noopener" class="secondary-btn hidden">🔗 เปิดลิงก์</a>
        <a id="modal-download-btn" href="#" download class="primary-btn hidden">💾 ดาวน์โหลดไฟล์</a>
        <button type="button" id="modal-share-btn" class="secondary-btn">📱 แสดง QR Code</button>
        <button type="button" id="modal-delete-btn" class="icon-btn-danger-outline">🗑️ ลบ</button>
      </div>
    </div>
  </div>

  <!-- QR Code Modal -->
  <div id="qr-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card text-center">
      <div class="modal-header">
        <h3 class="modal-title">📱 สแกนเพื่อเปิดบนมือถือ</h3>
        <button type="button" id="close-qr-modal-btn" class="close-btn">✕</button>
      </div>
      <div class="modal-body flex-center">
        <canvas id="qr-modal-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Toast Notification Bar -->
  <div id="toast" class="toast-bar hidden" role="alert"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
